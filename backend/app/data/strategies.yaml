orb:
  enabled: true
  rvol_threshold: 3
  universe_size: 30
  # candidate_pool_size: how many top-active symbols MarketDataService
  # fetches dynamically each morning before gap%/volume scoring narrows it
  # down to universe_size. Set `candidate_symbols: [...]` here instead to
  # pin a fixed pool (e.g. for backtesting).
  candidate_pool_size: 60
  opening_range: 5
  maximum_spread: 0.15
  risk: 1.25
  reward_risk_ratio: 2.0
  maximum_trades: 10
  # Real share volume now (market data is Massive, not Bybit perpetuals).
  min_premarket_volume: 200000

noise:
  enabled: true
  universe: ["SPY", "QQQ"]
  atr_period: 14
  envelope_width: 2
  atr_target_multiplier: 2.0
  risk: 1.0
  maximum_trades: 6

bias:
  enabled: true
  universe: ["SPY", "QQQ"]
  bias_window_minutes: 60
  entry_time: "15:30"
  exit_time: "16:00"
  stop_pct: 0.5
  risk: 1.5
  maximum_trades: 2

vwap_reversion:
  enabled: true
  universe: ["SPY", "QQQ"]
  num_std: 2.0
  adx_period: 14
  adx_threshold: 25.0
  atr_period: 14
  atr_stop_multiplier: 1.0
  entry_start: "10:00"
  entry_end: "15:00"
  time_exit: "15:45"
  risk: 1.0
  maximum_trades: 6

gap_fill:
  enabled: true
  universe: ["SPY", "QQQ"]
  min_gap_pct: 0.0015
  max_gap_pct: 0.0060
  vix_threshold: 25.0
  atr_period: 14
  partial_fill_fraction: 0.75
  hard_time_stop: "11:30"
  risk: 1.0
  maximum_trades: 2

breadth_pullback:
  enabled: true
  universe: ["SPY", "QQQ"]
  breadth_threshold: 1000.0
  atr_period: 14
  atr_multiplier: 1.2
  reward_risk_ratio: 2.0
  entry_start: "10:00"
  entry_end: "14:30"
  time_exit: "15:45"
  risk: 1.25
  maximum_trades: 4
