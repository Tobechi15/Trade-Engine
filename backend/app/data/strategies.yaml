orb:
  enabled: true
  rvol_threshold: 3
  universe_size: 30
  # candidate_pool_size: how many top-active symbols MarketDataService
  # fetches dynamically each morning before gap%/volume scoring narrows it
  # down to universe_size. Set `candidate_symbols: [...]` here instead to
  # pin a fixed pool (e.g. for backtesting).
  candidate_pool_size: 60
  opening_range: 5
  maximum_spread: 0.15
  risk: 1.25
  reward_risk_ratio: 2.0
  maximum_trades: 10
  # Placeholder - Bybit TradFi perpetual volume is contract count, not
  # underlying share volume; tune once you've observed real volume.
  min_premarket_volume: 1000

noise:
  enabled: true
  universe: ["SPY", "QQQ"]
  atr_period: 14
  envelope_width: 2
  atr_target_multiplier: 2.0
  risk: 1.0
  maximum_trades: 6

bias:
  enabled: true
  universe: ["SPY", "QQQ"]
  bias_window_minutes: 60
  entry_time: "15:30"
  exit_time: "16:00"
  stop_pct: 0.5
  risk: 1.5
  maximum_trades: 2
